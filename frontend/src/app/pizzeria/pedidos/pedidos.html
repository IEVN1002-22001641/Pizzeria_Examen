<div class="bg-slate-900/95 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-slate-950/50 text-slate-100">
  
  <!-- Encabezado de la Sección -->
  <div class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <div>
        <h2 class="text-xl font-black tracking-tight text-white">Registrar Pedidos</h2>
        <p class="text-xs text-slate-400 font-medium">Ingresa los datos de entrega y personaliza tu pedido</p>
      </div>
    </div>
    <span class="hidden sm:inline-flex px-3 py-1 text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full">
      Paso 1 de 3
    </span>
  </div>
  
  <!-- Formulario con la misma estructura y bindings exactos -->
  <form [formGroup]="pedidoForm" (ngSubmit)="agregarPizza()" class="space-y-6">
    
    <!-- Bloque 1: Datos del Cliente -->
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 shadow-inner backdrop-blur-sm transition-all duration-300 hover:border-slate-600/60">
      <div class="flex items-center gap-2 mb-4">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Información del Cliente</h3>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Nombre -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Nombre Completo:</label>
          <div class="relative">
            <input type="text" formControlName="nombre" 
                   class="block w-full bg-slate-900/90 text-slate-100 placeholder-slate-500 text-sm rounded-xl border border-slate-700/80 focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 p-3 transition-all duration-200 shadow-sm" 
                   placeholder="Ej. Maria Juarez">
          </div>
        </div>

        <!-- Dirección -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Dirección:</label>
          <div class="relative">
            <input type="text" formControlName="direccion" 
                   class="block w-full bg-slate-900/90 text-slate-100 placeholder-slate-500 text-sm rounded-xl border border-slate-700/80 focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 p-3 transition-all duration-200 shadow-sm" 
                   placeholder="Ej. 5 de mayo">
          </div>
        </div>

        <!-- Teléfono -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Teléfono:</label>
          <div class="relative">
            <input type="text" formControlName="telefono" 
                   class="block w-full bg-slate-900/90 text-slate-100 placeholder-slate-500 text-sm rounded-xl border border-slate-700/80 focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 p-3 transition-all duration-200 shadow-sm" 
                   placeholder="Ej. 477-787-23">
          </div>
        </div>

      </div>
    </div>

    <!-- Bloque 2: Opciones de Pizza -->
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 shadow-inner backdrop-blur-sm transition-all duration-300 hover:border-slate-600/60">
      <div class="flex items-center gap-2 mb-4">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path>
        </svg>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Configuración de la Pizza</h3>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        
        <!-- Tamaño de Pizza -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-300">Tamaño Pizza:</label>
          <div class="space-y-2">
            
            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900/80 border border-slate-700/60 hover:border-amber-400/50 cursor-pointer transition-all group">
              <div class="flex items-center gap-2.5">
                <input type="radio" value="Chica" formControlName="tamano" class="text-amber-500 focus:ring-amber-400/20 bg-slate-900 border-slate-700">
                <span class="text-sm font-medium text-slate-200 group-hover:text-white">Chica</span>
              </div>
              <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">$40</span>
            </label>

            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900/80 border border-slate-700/60 hover:border-amber-400/50 cursor-pointer transition-all group">
              <div class="flex items-center gap-2.5">
                <input type="radio" value="Mediana" formControlName="tamano" class="text-amber-500 focus:ring-amber-400/20 bg-slate-900 border-slate-700">
                <span class="text-sm font-medium text-slate-200 group-hover:text-white">Mediana</span>
              </div>
              <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">$80</span>
            </label>

            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900/80 border border-slate-700/60 hover:border-amber-400/50 cursor-pointer transition-all group">
              <div class="flex items-center gap-2.5">
                <input type="radio" value="Grande" formControlName="tamano" class="text-amber-500 focus:ring-amber-400/20 bg-slate-900 border-slate-700">
                <span class="text-sm font-medium text-slate-200 group-hover:text-white">Grande</span>
              </div>
              <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">$120</span>
            </label>

          </div>
        </div>

        <!-- Ingredientes (Modificado a Select) -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-semibold text-slate-300">Ingrediente:</label>
            <span class="text-[11px] text-amber-400 font-medium">+$10</span>
          </div>
          <select formControlName="ingredientes" 
                  class="block w-full bg-slate-900/90 text-slate-100 text-sm rounded-xl border border-slate-700/80 focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 p-3 transition-all duration-200 shadow-sm capitalize">
            <option value="" disabled selected>Selecciona un ingrediente</option>
            <option value="Jamón">Jamón ($10)</option>
            <option value="Piña">Piña ($10)</option>
            <option value="Champiñones">Champiñones ($10)</option>
            <option value="Pepperoni">Pepperoni ($10)</option>
            <option value="Salchicha">Salchicha ($10)</option>
            <option value="Extra Queso">Extra Queso ($10)</option>
          </select>
          <p class="text-[11px] text-slate-400 italic">Cada ingrediente adicional cuesta $10.</p>
        </div>

        <!-- Número de Pizzas y Botón de Acción -->
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-300">Num. de Pizzas:</label>
            <input type="number" formControlName="num_pizzas" min="1" 
                   class="block w-full bg-slate-900/90 text-slate-100 placeholder-slate-500 text-sm rounded-xl border border-slate-700/80 focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 p-3 transition-all duration-200 shadow-sm">
          </div>
          
          <div>
            <button type="submit" 
                    class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-red-950/50 hover:shadow-red-900/50 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
              </svg>
              <span>Agregar al Pedido</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </form>
</div>
